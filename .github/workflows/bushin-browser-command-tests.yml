name: "🍥 Bushin — testar controle visual e mensagens"
on:
  push:
    paths:
      - "browser_actions/**"
      - ".github/workflows/bushin-browser-command-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Conferir sintaxe do controlador"
        run: python -m py_compile browser_actions/live_controller.py browser_actions/live_desktop.py
      - name: "Testar limites de canais, mensagens e comandos"
        working-directory: browser_actions
        run: python -m unittest -v test_live_controller
