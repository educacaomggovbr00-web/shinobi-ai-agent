name: "🍥 Bushin Browser — Actions"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL HTTPS publica que deseja abrir"
        type: string
        required: true
        default: "https://example.com"
      passos_json:
        description: "Lista JSON (ate 12 acoes): click, fill, scroll, press, extract, screenshot, goto, wait"
        type: string
        required: true
        default: '[]'

permissions:
  contents: read

concurrency:
  group: "bushin-browser-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  navegador:
    name: "Chromium no GitHub Actions (sem Codespaces)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUSHIN_URL: ${{ inputs.url }}
      BUSHIN_STEPS: ${{ inputs.passos_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Testar validador de enderecos e comandos"
        run: python -m unittest discover -s browser_actions -p 'test_*.py' -v

      - name: "Instalar navegador Chromium"
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install chromium --with-deps

      - name: "Bushin: navegar, clicar, ler e gravar"
        run: python browser_actions/runner.py --url "$BUSHIN_URL" --steps "$BUSHIN_STEPS" --out bushin-output

      - name: "Salvar prints, texto, relatorio e video"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "bushin-browser-${{ github.run_id }}"
          path: bushin-output/
          retention-days: 3
          if-no-files-found: warn

      - name: "Resumo da execucao"
        if: always()
        shell: bash
        run: |
          echo '## 🍥 Bushin Browser' >> "$GITHUB_STEP_SUMMARY"
          echo 'Chromium executado em GitHub Actions, sem GitHub Codespaces.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f bushin-output/relatorio.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; r=json.load(open("bushin-output/relatorio.json")); print(json.dumps({k:r.get(k) for k in ("ok","title","final_url","steps_requested","error") if k in r}, ensure_ascii=False, indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Print, texto e video: secao Artifacts desta execucao apos o job finalizar.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Aviso: o runner nao mantem login/cookies e nao oferece video ao vivo durante a execucao.' >> "$GITHUB_STEP_SUMMARY"
