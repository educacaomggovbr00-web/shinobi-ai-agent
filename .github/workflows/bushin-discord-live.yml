name: "🍥 Bushin — Discord Linux AO VIVO"

on:
  workflow_dispatch:
  push:
    paths:
      - "browser_actions/start-request.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: bushin-discord-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  desktop:
    name: "Desktop Linux interativo — Discord"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: "Carregar projeto Bushin"
        uses: actions/checkout@v4

      - name: "Preparar Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Conferir script do desktop"
        run: |
          python -m py_compile browser_actions/live_desktop.py
          python -m py_compile browser_actions/live_controller.py
          python -m py_compile browser_actions/cloudflare_bridge.py
          node --check browser_actions/snapshot_upload.cjs
          python -m unittest discover -s browser_actions -p 'test_live_controller.py' -v

      - name: "Instalar Linux grafico e noVNC"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends xvfb x11vnc openbox novnc websockify
          python -m pip install 'aiohttp==3.11.18' 'playwright==1.56.0'
          python -m playwright install chromium --with-deps
          npm install --prefix browser_actions --no-save --no-package-lock --ignore-scripts --no-audit --no-fund '@actions/artifact@2.3.2'
          # Gateway tests run after aiohttp is installed (the early lint phase skips them).
          python -m unittest discover -s browser_actions -p 'test_*.py' -v

      - name: "Exportar configuracao autenticada do servico de artifacts"
        uses: actions/github-script@v7
        with:
          script: |
            for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_RESULTS_URL']) {
              if (process.env[key]) core.exportVariable(key, process.env[key]);
              core.info(key + ': ' + (process.env[key] ? 'presente' : 'ausente'));
            }

      - name: "Preparar tunel HTTPS efemero"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          chmod 700 "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" --version

      - name: "🍥 Linux AO VIVO — abrir link nos logs ou resumo"
        env:
          CLOUDFLARED_BIN: ${{ runner.temp }}/cloudflared
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🍥 Linux temporario iniciando, com Discord na tela."
          echo "Aguarde o LINK PRIVADO aparecer nos logs deste passo."
          echo "Nunca compartilhe o link. Quem tiver acesso pode controlar o navegador."
          python -u browser_actions/live_desktop.py
